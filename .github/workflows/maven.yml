# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  workflow_dispatch:
  # pull_request:
  #   branches: [ master ]

jobs:
  build:

    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
        - java: 17
          os: windows-latest
          arch: x64
          runner: windows-latest
          expander_leg: windows-latest-17-x64
    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        architecture: ${{ (matrix.os == 'windows-latest' && matrix.arch == 
          'arm64' && matrix.java == 8) && 'x64' || matrix.arch }}
    - name: Cache Maven repository
      uses: actions/cache@v4
      continue-on-error: true
      with:
        path: ~/.m2/repository
        key: maven-${{ matrix.os }}-${{ matrix.arch }}-java${{ matrix.java 
          }}-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          maven-${{ matrix.os }}-${{ matrix.arch }}-java${{ matrix.java }}-
    - name: Build with Maven
      shell: bash
      run: mvn -B package --file pom.xml "-Dmaven.test.skip=true"
    name: build [${{ matrix.expander_leg }}]
    timeout-minutes: 150
